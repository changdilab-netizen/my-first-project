<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 0%, #0a0520 30%, #1a0a3e 60%, #050010 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Serif KR', serif;
      color: #e8d5c4;
      position: relative;
      overflow: hidden;
    }

    /* 별 배경 효과 */
    body::before {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 30% 80%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 15% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 70% 30%, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40% 80%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 85% 70%, #fff, rgba(0,0,0,0));
      background-size: 200% 200%, 300% 300%, 250% 250%, 200% 200%, 300% 300%, 250% 250%, 280% 280%, 220% 220%, 300% 300%, 250% 250%;
      background-position: 0% 0%, 40% 60%, 130% 270%, 70% 100%, 150% 140%, 90% 10%, 20% 80%, 60% 40%, 50% 70%, 80% 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      animation: twinkle 8s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }

    body::after {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 800px 400px at 50% 10%, rgba(138, 43, 226, 0.25) 0%, transparent 40%),
        radial-gradient(ellipse 900px 450px at 30% 50%, rgba(75, 0, 130, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse 850px 400px at 70% 40%, rgba(138, 43, 226, 0.2) 0%, transparent 45%);
      pointer-events: none;
      z-index: 1;
      animation: aurora 8s ease-in-out infinite;
    }

    @keyframes aurora {
      0%, 100% {
        filter: blur(60px) opacity(0.6);
      }
      50% {
        filter: blur(70px) opacity(0.8);
      }
    }

    .sparkles {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      margin-left: -150px;
      margin-top: -150px;
      pointer-events: none;
      z-index: 2;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      opacity: 0;
      pointer-events: none;
    }

    .card.revealed ~ .sparkles .sparkle {
      animation: sparkleOutward 0.8s ease-out forwards;
    }

    .sparkle:nth-child(1) { animation-delay: 0s; }
    .sparkle:nth-child(2) { animation-delay: 0.05s; }
    .sparkle:nth-child(3) { animation-delay: 0.1s; }
    .sparkle:nth-child(4) { animation-delay: 0.15s; }
    .sparkle:nth-child(5) { animation-delay: 0.2s; }
    .sparkle:nth-child(6) { animation-delay: 0.25s; }
    .sparkle:nth-child(7) { animation-delay: 0.3s; }
    .sparkle:nth-child(8) { animation-delay: 0.35s; }

    .card.revealed ~ .sparkles .sparkle {
      animation: sparkleOutward 0.8s ease-out forwards;
    }

    @keyframes sparkleOutward {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
        filter: drop-shadow(0 0 4px #daa520);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
        filter: drop-shadow(0 0 0px #daa520);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3);
      color: #daa520;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3); }
      50% { text-shadow: 0 0 30px rgba(218, 165, 32, 0.8), 0 0 60px rgba(75, 0, 130, 0.5); }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
        filter: drop-shadow(0 15px 30px rgba(218, 165, 32, 0.15));
      }
      50% {
        transform: translateY(-25px);
        filter: drop-shadow(0 25px 50px rgba(218, 165, 32, 0.3));
      }
    }

    .card-container {
      perspective: 1000px;
      height: 420px;
      width: 280px;
      animation: float 5s ease-in-out infinite;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.revealed {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #daa520;
      border-radius: 15px;
      font-size: 4rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.4), inset 0 0 30px rgba(218, 165, 32, 0.1);
    }

    .card-back {
      background-image:
        url('data:image/svg+xml;utf8,<svg width="280" height="420" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="stars" width="50" height="50" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.2" fill="%23daa520"/><circle cx="35" cy="20" r="0.8" fill="%23daa520" opacity="0.6"/><circle cx="25" cy="40" r="1" fill="%23daa520" opacity="0.7"/><circle cx="45" cy="35" r="0.7" fill="%23daa520" opacity="0.5"/></pattern></defs><rect width="280" height="420" fill="%231a0f33"/><rect width="280" height="420" fill="url(%23stars)"/><circle cx="140" cy="210" r="95" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.2"/><circle cx="140" cy="210" r="75" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.15"/><circle cx="140" cy="210" r="55" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.1"/><path d="M 140 115 L 165 180 L 115 180 Z" fill="none" stroke="%23daa520" opacity="0.1" stroke-width="0.5"/><path d="M 140 305 L 165 240 L 115 240 Z" fill="none" stroke="%23daa520" opacity="0.1" stroke-width="0.5"/><line x1="50" y1="210" x2="230" y2="210" stroke="%23daa520" stroke-width="0.5" opacity="0.08"/><line x1="140" y1="100" x2="140" y2="320" stroke="%23daa520" stroke-width="0.5" opacity="0.08"/><text x="140" y="220" text-anchor="middle" font-size="70" fill="%23daa520" opacity="0.08" font-family="serif">✦</text></svg>'),
        linear-gradient(135deg, #2d1b4e 0%, #1a0f33 100%);
      background-size: 100% 100%, 100% 100%;
      background-position: center, center;
      color: #daa520;
      font-weight: bold;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-front {
      background: linear-gradient(135deg, #1a0f33 0%, #2d1b4e 100%);
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    .card-symbol {
      font-size: 5rem;
    }

    .card-name {
      font-size: 1.3rem;
      color: #daa520;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .card-message {
      font-size: 0.95rem;
      color: #e8d5c4;
      line-height: 1.6;
      font-style: italic;
      margin-top: 0.5rem;
    }

    button {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a3e;
      background: linear-gradient(135deg, #daa520 0%, #ffd700 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(218, 165, 32, 0.4), 0 8px 15px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.7), 0 12px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
    }

    button:active {
      transform: translateY(-1px);
    }

    .share-btn {
      margin-top: 0.8rem;
      padding: 0;
      font-size: 0.75rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 400;
      color: #8b7355;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: none;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .share-btn:hover {
      color: #a89070;
      opacity: 0.9;
      text-decoration: underline;
    }

    .share-btn:active {
      transform: none;
      opacity: 0.8;
    }

    .share-btn.copied {
      color: #7cb342;
      opacity: 0.9;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #b0956e;
      text-align: center;
      margin-top: -1.5rem;
      font-style: italic;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .card-container {
        height: 360px;
        width: 240px;
      }

      .card-face {
        font-size: 3.5rem;
        padding: 1.5rem;
      }

      button {
        padding: 0.9rem 2.5rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 오늘의 말씀 ✨</h1>
    <p class="subtitle">영감의 메시지를 받아보세요</p>

    <div class="card-container">
      <div class="card" id="card">
        <div class="card-face card-back">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; line-height: 1.2;">
            <span style="font-size: 1.5rem; color: #daa520;">✦</span>
            <span style="font-size: 1rem; color: #daa520;">✧ ✧ ✧</span>
            <span style="font-size: 1.2rem; color: #daa520;">◇ ◆ ◇</span>
            <span style="font-size: 1rem; color: #daa520;">✧ ✧ ✧</span>
            <span style="font-size: 1.5rem; color: #daa520;">✦</span>
          </div>
        </div>
        <div class="card-face card-front">
          <div class="card-symbol" id="cardSymbol">📖</div>
          <div class="card-name" id="cardName">말씀</div>
          <div class="card-message" id="cardMessage">말씀을 받아주세요</div>
        </div>
      </div>
      <div class="sparkles">
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
      </div>
    </div>

    <button id="drawBtn">오늘의 말씀 받기</button>
    <button id="shareBtn" class="share-btn">친구에게 공유하기</button>
  </div>

  <script>
    const cards = [
      {
        name: '✦ 희망',
        symbol: '⭐',
        message: '주님의 빛이 당신을 밝히고 있습니다.\n새로운 축복이 다가오고 있으니 마음을 열어두세요.'
      },
      {
        name: '✦ 인도',
        symbol: '🌙',
        message: '조용한 마음으로 하나님의 음성을 들으세요.\n영의 도움이 당신을 인도하고 있습니다.'
      },
      {
        name: '✦ 기쁨',
        symbol: '☀️',
        message: '주님 안에서 기쁨을 누리세요.\n삶의 모든 순간이 축복으로 빛날 준비가 되어 있습니다.'
      },
      {
        name: '✦ 변화',
        symbol: '🎡',
        message: '하나님의 계획을 믿고 받아들이세요.\n이 변화 속에서 더 큰 목적이 드러날 것입니다.'
      },
      {
        name: '✦ 믿음',
        symbol: '🦁',
        message: '당신 안에 주님의 힘이 있습니다.\n두려움 없이 앞으로 나아가세요.'
      },
      {
        name: '✦ 거듭남',
        symbol: '🦋',
        message: '옛것은 지나고 새것이 시작됩니다.\n주님의 사랑 속에서 새로 태어나세요.'
      },
      {
        name: '✦ 연합',
        symbol: '💝',
        message: '사랑과 용서 속에서 관계를 나누세요.\n마음이 맞는 사람들과 깊은 연결을 이루세요.'
      },
      {
        name: '✦ 명상',
        symbol: '🔦',
        message: '침묵 속에서 주님과 만나세요.\n내면의 평온함이 모든 답을 가져올 것입니다.'
      },
      {
        name: '✦ 능력',
        symbol: '🎩',
        message: '당신이 받은 은사를 깨어나게 하세요.\n주님이 주신 재능을 세상에 드러내세요.'
      },
      {
        name: '✦ 지혜',
        symbol: '👑',
        message: '하나님의 지혜를 구하세요.\n영적 깨달음이 당신의 길을 밝힐 것입니다.'
      },
      {
        name: '✦ 리더십',
        symbol: '👨‍🦱',
        message: '주님의 사명을 받고 앞서 나아가세요.\n다른 사람들의 영혼을 돌보는 책임을 감당하세요.'
      },
      {
        name: '✦ 풍요',
        symbol: '👸',
        message: '영적 풍요로움이 당신의 것입니다.\n주님의 충만한 은혜를 누려보세요.'
      },
      {
        name: '✦ 전통',
        symbol: '🙏',
        message: '영적 선배들의 가르침을 존중하세요.\n신앙의 유산 속에서 힘을 얻으세요.'
      },
      {
        name: '✦ 정의',
        symbol: '⚖️',
        message: '올바름을 추구하세요.\n주님의 공의가 당신의 판단을 인도할 것입니다.'
      },
      {
        name: '✦ 절제',
        symbol: '🍷',
        message: '조절과 균형 속에서 영적 성숙을 이루세요.\n영혼의 평온함이 최고의 재산입니다.'
      },
      {
        name: '✦ 치유',
        symbol: '😈',
        message: '상처를 직시하고 용서하세요.\n주님의 사랑이 모든 것을 치유할 것입니다.'
      },
      {
        name: '✦ 부활',
        symbol: '🗼',
        message: '어려움 속에서도 부활의 소망을 잃지 마세요.\n새로운 생명이 앞으로 펼쳐질 것입니다.'
      },
      {
        name: '✦ 소망',
        symbol: '☁️',
        message: '주님의 약속을 기억하세요.\n영원한 소망이 모든 시련을 견디게 하실 것입니다.'
      },
      {
        name: '✦ 축복',
        symbol: '🍀',
        message: '축복의 시간입니다.\n주님의 은혜가 풍성히 내려질 것입니다.'
      },
      {
        name: '✦ 성장',
        symbol: '👻',
        message: '영의 깊이가 더해지고 있습니다.\n주님 안에서 계속 성장해 나가세요.'
      },
      {
        name: '✦ 흐름',
        symbol: '💧',
        message: '영의 인도함에 따르세요.\n주님의 뜻이 자연스럽게 이루어질 것입니다.'
      },
      {
        name: '✦ 열정',
        symbol: '🔥',
        message: '주님을 향한 사랑의 불을 밝히세요.\n헌신적인 마음으로 나아가세요.'
      },
      {
        name: '✦ 새로움',
        symbol: '🌪️',
        message: '새로운 영의 바람이 불고 있습니다.\n신선한 시각으로 삶을 보세요.'
      },
      {
        name: '✦ 기초',
        symbol: '🌍',
        message: '견고한 믿음의 기초를 다지세요.\n주님 위에 삶을 세우세요.'
      }
    ];

    let lastIndex = -1;
    const cardElement = document.getElementById('card');
    const drawBtn = document.getElementById('drawBtn');
    const cardSymbol = document.getElementById('cardSymbol');
    const cardName = document.getElementById('cardName');
    const cardMessage = document.getElementById('cardMessage');
    const sparkles = document.querySelectorAll('.sparkle');

    sparkles.forEach((sparkle, index) => {
      const angle = (index / sparkles.length) * 360;
      const rad = angle * Math.PI / 180;
      const x = Math.cos(rad) * 140;
      const y = Math.sin(rad) * 140;
      sparkle.style.setProperty('--tx', `${x}px`);
      sparkle.style.setProperty('--ty', `${y}px`);
    });

    function getRandomCard() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * cards.length);
      } while (newIndex === lastIndex && cards.length > 1);
      lastIndex = newIndex;
      return cards[newIndex];
    }

    drawBtn.addEventListener('click', () => {
      const card = getRandomCard();

      if (cardElement.classList.contains('revealed')) {
        cardElement.classList.remove('revealed');
        setTimeout(() => {
          cardSymbol.textContent = card.symbol;
          cardName.textContent = card.name;
          cardMessage.textContent = card.message;
          cardElement.classList.add('revealed');
        }, 600);
      } else {
        cardSymbol.textContent = card.symbol;
        cardName.textContent = card.name;
        cardMessage.textContent = card.message;
        cardElement.classList.add('revealed');
      }
    });

    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', () => {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.textContent = '복사됨! ✓';
        shareBtn.classList.add('copied');

        setTimeout(() => {
          shareBtn.textContent = '친구에게 공유하기';
          shareBtn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        shareBtn.textContent = '복사 실패';
        setTimeout(() => {
          shareBtn.textContent = '친구에게 공유하기';
        }, 2000);
      });
    });
  </script>
</body>
</html>
