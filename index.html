<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 0%, #0a0520 30%, #1a0a3e 60%, #050010 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Serif KR', serif;
      color: #e8d5c4;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 30% 80%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 15% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 70% 30%, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40% 80%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 85% 70%, #fff, rgba(0,0,0,0));
      background-size: 200% 200%, 300% 300%, 250% 250%, 200% 200%, 300% 300%, 250% 250%, 280% 280%, 220% 220%, 300% 300%, 250% 250%;
      background-position: 0% 0%, 40% 60%, 130% 270%, 70% 100%, 150% 140%, 90% 10%, 20% 80%, 60% 40%, 50% 70%, 80% 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      animation: twinkle 8s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }

    body::after {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 800px 400px at 50% 10%, rgba(218, 165, 32, 0.25) 0%, transparent 40%),
        radial-gradient(ellipse 900px 450px at 30% 50%, rgba(75, 0, 130, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse 850px 400px at 70% 40%, rgba(138, 43, 226, 0.2) 0%, transparent 45%);
      pointer-events: none;
      z-index: 1;
      animation: aurora 8s ease-in-out infinite;
    }

    @keyframes aurora {
      0%, 100% {
        filter: blur(60px) opacity(0.6);
      }
      50% {
        filter: blur(70px) opacity(0.8);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      max-width: 1000px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3);
      color: #daa520;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3); }
      50% { text-shadow: 0 0 30px rgba(218, 165, 32, 0.8), 0 0 60px rgba(75, 0, 130, 0.5); }
    }

    .cards-container {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 420px;
      perspective: 1000px;
    }

    .card-wrapper {
      perspective: 1000px;
      height: 420px;
      width: 220px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .card-wrapper.selected {
      transform: scale(1.15);
      filter: drop-shadow(0 0 30px rgba(218, 165, 32, 0.8));
    }

    .card-wrapper:not(.selected):hover {
      transform: scale(1.05);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.revealed {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #daa520;
      border-radius: 15px;
      font-size: 4rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.4), inset 0 0 30px rgba(218, 165, 32, 0.1);
    }

    .card-back {
      background: linear-gradient(135deg, #2d1b4e 0%, #1a0f33 100%);
      color: #daa520;
      font-weight: bold;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-front {
      background: linear-gradient(135deg, #1a0f33 0%, #2d1b4e 100%);
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    .card-symbol {
      font-size: 5rem;
    }

    .card-name {
      font-size: 1.3rem;
      color: #daa520;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .card-message {
      font-size: 0.95rem;
      color: #e8d5c4;
      line-height: 1.6;
      font-style: italic;
      margin-top: 0.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    button {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a3e;
      background: linear-gradient(135deg, #daa520 0%, #ffd700 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(218, 165, 32, 0.4), 0 8px 15px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.7), 0 12px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
    }

    button:active {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      font-size: 1.1rem;
      color: #daa520;
      min-height: 2rem;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #b0956e;
      text-align: center;
      margin-top: -1.5rem;
      font-style: italic;
    }

    .share-btn {
      margin-top: 0.8rem;
      padding: 0;
      font-size: 0.75rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 400;
      color: #8b7355;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: none;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .share-btn:hover {
      color: #a89070;
      opacity: 0.9;
      text-decoration: underline;
    }

    .share-btn.copied {
      color: #7cb342;
      opacity: 0.9;
    }

    @media (max-width: 800px) {
      h1 {
        font-size: 2rem;
      }

      .cards-container {
        gap: 1rem;
      }

      .card-wrapper {
        height: 360px;
        width: 180px;
      }

      .card-face {
        font-size: 3.5rem;
        padding: 1.5rem;
      }

      button {
        padding: 0.9rem 2.5rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 오늘의 운세 ✨</h1>
    <p class="subtitle">카드를 뽑아 오늘의 운명을 알아보세요</p>

    <div id="cardsSection" style="display: none;">
      <div class="cards-container" id="cardsContainer"></div>
      <div class="result-message" id="resultMessage">카드를 선택해주세요</div>
    </div>

    <div class="button-group">
      <button id="drawBtn">오늘의 운세 뽑기</button>
      <button id="shareBtn" class="share-btn">친구에게 공유하기</button>
    </div>
  </div>

  <script>
    const cards = [
      {
        name: '✦ 별',
        symbol: '⭐',
        message: '밝은 희망이 당신을 감싸고 있습니다.\n새로운 기회가 다가오고 있으니 준비하세요.'
      },
      {
        name: '✦ 달',
        symbol: '🌙',
        message: '직관을 따르세요.\n무의식의 메시지가 당신을 인도하고 있습니다.'
      },
      {
        name: '✦ 태양',
        symbol: '☀️',
        message: '성공과 행복이 당신의 것입니다.\n모든 것이 밝게 빛날 준비가 되어 있습니다.'
      },
      {
        name: '✦ 운명의 수레바퀴',
        symbol: '🎡',
        message: '변화의 시간입니다.\n흐름을 받아들이고 새로운 시작을 맞이하세요.'
      },
      {
        name: '✦ 힘',
        symbol: '🦁',
        message: '당신 안에는 숨겨진 힘이 있습니다.\n내면의 용기를 발휘할 때입니다.'
      },
      {
        name: '✦ 죽음(변화)',
        symbol: '🦋',
        message: '끝남은 새로운 시작입니다.\n과거를 놓고 새로운 자신으로 거듭나세요.'
      },
      {
        name: '✦ 연인',
        symbol: '💝',
        message: '연결과 선택의 시간입니다.\n당신의 심장이 원하는 것을 믿으세요.'
      },
      {
        name: '✦ 은둔자',
        symbol: '🔦',
        message: '내면의 목소리를 들어보세요.\n침묵 속에서 진리가 나타날 것입니다.'
      },
      {
        name: '✦ 마술사',
        symbol: '🎩',
        message: '당신의 재능이 꽃피울 시간입니다.\n능력을 믿고 행동에 옮기세요.'
      },
      {
        name: '✦ 여사제',
        symbol: '👑',
        message: '신비로운 지혜가 당신을 인도합니다.\n숨겨진 진실을 찾아보세요.'
      },
      {
        name: '✦ 황제',
        symbol: '👨‍🦱',
        message: '리더십과 권력이 당신의 손에 있습니다.\n자신감 있게 나아가세요.'
      },
      {
        name: '✦ 황후',
        symbol: '👸',
        message: '풍요로움과 창조성이 넘쳐날 것입니다.\n새로운 프로젝트를 시작하세요.'
      },
      {
        name: '✦ 교황',
        symbol: '🙏',
        message: '전통과 지혜를 존중하세요.\n멘토의 가르침이 도움이 될 것입니다.'
      },
      {
        name: '✦ 정의',
        symbol: '⚖️',
        message: '균형과 공정함이 이루어질 것입니다.\n올바른 선택을 하세요.'
      },
      {
        name: '✦ 절제',
        symbol: '🍷',
        message: '조화와 인내의 시간입니다.\n균형 잡힌 접근이 성공의 열쇠입니다.'
      },
      {
        name: '✦ 악마',
        symbol: '😈',
        message: '당신의 욕망과 마주하세요.\n그것을 이해하면 자유로워질 것입니다.'
      },
      {
        name: '✦ 탑',
        symbol: '🗼',
        message: '급격한 변화가 닥칠 수 있습니다.\n하지만 그것은 새로운 길을 열어줄 것입니다.'
      },
      {
        name: '✦ 희망',
        symbol: '☁️',
        message: '희망은 절대 사라지지 않습니다.\n미래는 더 밝을 것입니다.'
      },
      {
        name: '✦ 행운',
        symbol: '🍀',
        message: '행운이 당신의 곁에 있습니다.\n이 기회를 놓치지 마세요.'
      },
      {
        name: '✦ 영혼',
        symbol: '👻',
        message: '영혼의 성장이 시작됩니다.\n깊이 있는 삶을 살아가세요.'
      },
      {
        name: '✦ 물',
        symbol: '💧',
        message: '감정과 직관이 흐릅니다.\n당신의 마음을 믿으세요.'
      },
      {
        name: '✦ 불',
        symbol: '🔥',
        message: '열정과 에너지가 폭발합니다.\n당신의 불을 밝혀내세요.'
      },
      {
        name: '✦ 바람',
        symbol: '🌪️',
        message: '변화의 바람이 불어옵니다.\n새로운 아이디어가 떠오를 것입니다.'
      },
      {
        name: '✦ 대지',
        symbol: '🌍',
        message: '안정과 번영이 다가옵니다.\n뿌리를 내리고 성장하세요.'
      }
    ];

    const drawBtn = document.getElementById('drawBtn');
    const shareBtn = document.getElementById('shareBtn');
    const cardsSection = document.getElementById('cardsSection');
    const cardsContainer = document.getElementById('cardsContainer');
    const resultMessage = document.getElementById('resultMessage');
    let selectedCardData = null;

    function getRandomCards(count) {
      const shuffled = [...cards].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function createCardElement(cardData, index) {
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';
      wrapper.dataset.index = index;

      const card = document.createElement('div');
      card.className = 'card';

      const cardBack = document.createElement('div');
      cardBack.className = 'card-face card-back';
      cardBack.innerHTML = '<span>✦</span>';

      const cardFront = document.createElement('div');
      cardFront.className = 'card-face card-front';
      cardFront.innerHTML = `
        <div class="card-symbol">${cardData.symbol}</div>
        <div class="card-name">${cardData.name}</div>
        <div class="card-message">${cardData.message}</div>
      `;

      card.appendChild(cardBack);
      card.appendChild(cardFront);
      wrapper.appendChild(card);

      wrapper.addEventListener('click', () => selectCard(wrapper, cardData));

      return wrapper;
    }

    function selectCard(wrapper, cardData) {
      document.querySelectorAll('.card-wrapper').forEach(w => {
        w.classList.remove('selected');
      });

      wrapper.classList.add('selected');
      selectedCardData = cardData;
      resultMessage.textContent = `"${cardData.name}"을(를) 선택하셨습니다! ✨`;
    }

    drawBtn.addEventListener('click', () => {
      const selectedCards = getRandomCards(3);
      cardsContainer.innerHTML = '';
      selectedCardData = null;
      resultMessage.textContent = '카드를 선택해주세요';

      selectedCards.forEach((cardData, index) => {
        const cardElement = createCardElement(cardData, index);
        cardsContainer.appendChild(cardElement);

        setTimeout(() => {
          const card = cardElement.querySelector('.card');
          card.classList.add('revealed');
        }, 100 + index * 150);
      });

      cardsSection.style.display = 'block';
      drawBtn.textContent = '다시 뽑기';
    });

    shareBtn.addEventListener('click', () => {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.textContent = '복사됨! ✓';
        shareBtn.classList.add('copied');

        setTimeout(() => {
          shareBtn.textContent = '친구에게 공유하기';
          shareBtn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        shareBtn.textContent = '복사 실패';
        setTimeout(() => {
          shareBtn.textContent = '친구에게 공유하기';
        }, 2000);
      });
    });
  </script>
</body>
</html>
