<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 성경말씀</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 0%, #0a0520 30%, #1a0a3e 60%, #050010 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Serif KR', serif;
      color: #e8d5c4;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 30% 80%, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 15% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 70% 30%, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40% 80%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 85% 70%, #fff, rgba(0,0,0,0));
      background-size: 200% 200%, 300% 300%, 250% 250%, 200% 200%, 300% 300%, 250% 250%, 280% 280%, 220% 220%, 300% 300%, 250% 250%;
      background-position: 0% 0%, 40% 60%, 130% 270%, 70% 100%, 150% 140%, 90% 10%, 20% 80%, 60% 40%, 50% 70%, 80% 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      animation: twinkle 8s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }

    body::after {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 800px 400px at 50% 10%, rgba(138, 43, 226, 0.25) 0%, transparent 40%),
        radial-gradient(ellipse 900px 450px at 30% 50%, rgba(75, 0, 130, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse 850px 400px at 70% 40%, rgba(138, 43, 226, 0.2) 0%, transparent 45%);
      pointer-events: none;
      z-index: 1;
      animation: aurora 8s ease-in-out infinite;
    }

    @keyframes aurora {
      0%, 100% {
        filter: blur(60px) opacity(0.6);
      }
      50% {
        filter: blur(70px) opacity(0.8);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3);
      color: #daa520;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(218, 165, 32, 0.6), 0 0 40px rgba(75, 0, 130, 0.3); }
      50% { text-shadow: 0 0 30px rgba(218, 165, 32, 0.8), 0 0 60px rgba(75, 0, 130, 0.5); }
    }

    .scripture-container {
      perspective: 1000px;
      height: 380px;
      width: 100%;
      max-width: 500px;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
        filter: drop-shadow(0 15px 30px rgba(218, 165, 32, 0.15));
      }
      50% {
        transform: translateY(-25px);
        filter: drop-shadow(0 25px 50px rgba(218, 165, 32, 0.3));
      }
    }

    .scripture {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .scripture.revealed {
      transform: rotateY(180deg);
    }

    .scripture-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #daa520;
      border-radius: 15px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.4), inset 0 0 30px rgba(218, 165, 32, 0.1);
    }

    .scripture-back {
      background-image:
        url('data:image/svg+xml;utf8,<svg width="500" height="380" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="stars" width="50" height="50" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.2" fill="%23daa520"/><circle cx="35" cy="20" r="0.8" fill="%23daa520" opacity="0.6"/><circle cx="25" cy="40" r="1" fill="%23daa520" opacity="0.7"/><circle cx="45" cy="35" r="0.7" fill="%23daa520" opacity="0.5"/></pattern></defs><rect width="500" height="380" fill="%231a0f33"/><rect width="500" height="380" fill="url(%23stars)"/><circle cx="250" cy="190" r="95" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.2"/><circle cx="250" cy="190" r="75" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.15"/><circle cx="250" cy="190" r="55" fill="none" stroke="%23daa520" stroke-width="0.8" opacity="0.1"/><path d="M 250 95 L 275 160 L 225 160 Z" fill="none" stroke="%23daa520" opacity="0.1" stroke-width="0.5"/><path d="M 250 285 L 275 220 L 225 220 Z" fill="none" stroke="%23daa520" opacity="0.1" stroke-width="0.5"/><line x1="150" y1="190" x2="350" y2="190" stroke="%23daa520" stroke-width="0.5" opacity="0.08"/><line x1="250" y1="80" x2="250" y2="300" stroke="%23daa520" stroke-width="0.5" opacity="0.08"/><text x="250" y="200" text-anchor="middle" font-size="50" fill="%23daa520" opacity="0.08" font-family="serif">✦</text></svg>'),
        linear-gradient(135deg, #2d1b4e 0%, #1a0f33 100%);
      background-size: 100% 100%, 100% 100%;
      background-position: center, center;
      color: #daa520;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .scripture-front {
      background: linear-gradient(135deg, #1a0f33 0%, #2d1b4e 100%);
      transform: rotateY(180deg);
      gap: 1.5rem;
      padding: 1.5rem;
    }

    .scripture-text {
      font-size: 1rem;
      color: #e8d5c4;
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 1rem;
    }

    .scripture-reference {
      font-size: 0.9rem;
      color: #daa520;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: auto;
    }

    button {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a3e;
      background: linear-gradient(135deg, #daa520 0%, #ffd700 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(218, 165, 32, 0.4), 0 8px 15px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.7), 0 12px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
    }

    button:active {
      transform: translateY(-1px);
    }

    .share-btn {
      margin-top: 0.8rem;
      padding: 0;
      font-size: 0.75rem;
      font-family: 'Noto Serif KR', serif;
      font-weight: 400;
      color: #8b7355;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: none;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .share-btn:hover {
      color: #a89070;
      opacity: 0.9;
      text-decoration: underline;
    }

    .share-btn.copied {
      color: #7cb342;
      opacity: 0.9;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #b0956e;
      text-align: center;
      margin-top: -1.5rem;
      font-style: italic;
    }

    .sparkles {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      margin-left: -150px;
      margin-top: -150px;
      pointer-events: none;
      z-index: 2;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      opacity: 0;
      pointer-events: none;
    }

    .scripture.revealed ~ .sparkles .sparkle {
      animation: sparkleOutward 0.8s ease-out forwards;
    }

    .sparkle:nth-child(1) { animation-delay: 0s; }
    .sparkle:nth-child(2) { animation-delay: 0.05s; }
    .sparkle:nth-child(3) { animation-delay: 0.1s; }
    .sparkle:nth-child(4) { animation-delay: 0.15s; }
    .sparkle:nth-child(5) { animation-delay: 0.2s; }
    .sparkle:nth-child(6) { animation-delay: 0.25s; }
    .sparkle:nth-child(7) { animation-delay: 0.3s; }
    .sparkle:nth-child(8) { animation-delay: 0.35s; }

    @keyframes sparkleOutward {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
        filter: drop-shadow(0 0 4px #daa520);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
        filter: drop-shadow(0 0 0px #daa520);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .scripture-container {
        height: 360px;
      }

      .scripture-face {
        font-size: 3.5rem;
        padding: 1.5rem;
      }

      button {
        padding: 0.9rem 2.5rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 오늘의 성경말씀 📖</h1>
    <p class="subtitle">하나님의 말씀을 마음에 새기세요</p>

    <div class="scripture-container">
      <div class="scripture" id="scripture">
        <div class="scripture-face scripture-back">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; line-height: 1.2;">
            <span style="font-size: 1.5rem; color: #daa520;">✦</span>
            <span style="font-size: 1rem; color: #daa520;">✧ ✧ ✧</span>
            <span style="font-size: 1.2rem; color: #daa520;">◇ ◆ ◇</span>
            <span style="font-size: 1rem; color: #daa520;">✧ ✧ ✧</span>
            <span style="font-size: 1.5rem; color: #daa520;">✦</span>
          </div>
        </div>
        <div class="scripture-face scripture-front">
          <div class="scripture-text" id="scriptureText">주의 말씀은 내 발의 등이요</div>
          <div class="scripture-reference" id="scriptureRef">시편 119:105</div>
        </div>
      </div>
      <div class="sparkles">
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">✨</span>
      </div>
    </div>

    <button id="drawBtn">오늘의 말씀 받기</button>
    <button id="shareBtn" class="share-btn">친구와 나누기</button>
  </div>

  <script>
    const scriptures = [
      {
        text: '예수께서 이르시되 나는 길이요 진리요 생명이니\n나로 말미암지 않고는 아버지께로 올 자가 없느니라',
        reference: '요한복음 14:6'
      },
      {
        text: '주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라',
        reference: '사도행전 16:31'
      },
      {
        text: '모든 것이 다 내게 주어졌으니\n그러므로 나를 본 자는 아버지를 보았거늘',
        reference: '요한복음 14:9'
      },
      {
        text: '예수께서 그들에게 이르시되\n내가 진실로 진실로 너희에게 이르노니\n나는 양의 문이라',
        reference: '요한복음 10:7'
      },
      {
        text: '하나님이 세상을 이처럼 사랑하사\n독생자를 주셨으니 이는 저를 믿는 자마다\n영생을 얻게 하려 하심이라',
        reference: '요한복음 3:16'
      },
      {
        text: '주 예수의 이름을 믿으라\n그리하면 구원을 받으리라',
        reference: '사도행전 10:43'
      },
      {
        text: '나는 포도나무요 너희는 가지니\n저가 내 안에 내가 저 안에 있으면\n이 사람은 많은 열매를 맺나니',
        reference: '요한복음 15:5'
      },
      {
        text: '영생은 곧 유일하신 참 하나님과\n그의 보내신 자 예수 그리스도를 아는 것이니이다',
        reference: '요한복음 17:3'
      },
      {
        text: '나는 평안을 너희에게 끼쳐 놓노니\n곧 나의 평안을 너희에게 주는 것이라',
        reference: '요한복음 14:27'
      },
      {
        text: '그러므로 무엇이든지 구하는 것은\n받은 줄로 믿으라 그러면 너희 것이 되리라',
        reference: '마가복음 11:24'
      },
      {
        text: '내 양은 내 음성을 들으며\n나는 그들을 알며 그들은 나를 따르느니라',
        reference: '요한복음 10:27'
      },
      {
        text: '주를 경외하는 것은 지혜의 시작이요\n거룩한 자를 아는 것은 명철이니라',
        reference: '잠언 9:10'
      },
      {
        text: '내게 주어진 모든 것을 아버지께서 주신 것이니\n나에게 와서 마시라 목이 마르지 아니하리니',
        reference: '요한복음 7:37'
      },
      {
        text: '너희는 세상의 빛이라\n산 위에 있는 도시를 숨길 수 없나니',
        reference: '마태복음 5:14'
      },
      {
        text: '너는 마음을 다하고 목숨을 다하고 뜻을 다하여\n주 너의 하나님을 사랑하라',
        reference: '마태복음 22:37'
      },
      {
        text: '수고하고 무거운 짐 진 자들아\n다 내게로 오라 내가 너희를 쉬게 하리라',
        reference: '마태복음 11:28'
      },
      {
        text: '우리가 그 피로 말미암아 구속 곧 죄 사함을 받았으니',
        reference: '에베소서 1:7'
      },
      {
        text: '믿음이 없이는 하나님을 기쁘시게 할 수 없나니\n하나님께 나아가는 자는 반드시 그가 계신 것과\n자기를 찾는 자들에게 상 주시는 것을 믿어야 할지니라',
        reference: '히브리서 11:6'
      },
      {
        text: '이 모든 것에 더하여 사랑을 입으라\n이것이 모든 것을 연결하는 띠니라',
        reference: '골로새서 3:14'
      },
      {
        text: '내가 그리스도와 함께 십자가에 못 박혔나니\n그러나 내가 사는 것은 내가 아니요\n오직 내 안에 그리스도께서 사시는 것이라',
        reference: '갈라디아서 2:20'
      },
      {
        text: '내 손에 너를 새겨 내었노라\n네 성벽이 항상 내 앞에 있도다',
        reference: '이사야 49:16'
      },
      {
        text: '사랑을 따라 구하고 또 신령한 것들을 사모하되\n특히 예언하기를 원하라',
        reference: '고린도전서 14:1'
      },
      {
        text: '예수님이 모든 것이 가능한 분이심을 믿으라\n그러면 너는 볼 것이다',
        reference: '마가복음 9:23'
      },
      {
        text: '주의 말씀은 내 발의 등이요\n내 길의 빛이로다',
        reference: '시편 119:105'
      }
    ];

    let lastIndex = -1;
    const scriptureElement = document.getElementById('scripture');
    const drawBtn = document.getElementById('drawBtn');
    const scriptureText = document.getElementById('scriptureText');
    const scriptureRef = document.getElementById('scriptureRef');
    const shareBtn = document.getElementById('shareBtn');
    const sparkles = document.querySelectorAll('.sparkle');

    sparkles.forEach((sparkle, index) => {
      const angle = (index / sparkles.length) * 360;
      const rad = angle * Math.PI / 180;
      const x = Math.cos(rad) * 140;
      const y = Math.sin(rad) * 140;
      sparkle.style.setProperty('--tx', `${x}px`);
      sparkle.style.setProperty('--ty', `${y}px`);
    });

    function getRandomScripture() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * scriptures.length);
      } while (newIndex === lastIndex && scriptures.length > 1);
      lastIndex = newIndex;
      return scriptures[newIndex];
    }

    drawBtn.addEventListener('click', () => {
      const scripture = getRandomScripture();

      if (scriptureElement.classList.contains('revealed')) {
        scriptureElement.classList.remove('revealed');
        setTimeout(() => {
          scriptureText.textContent = scripture.text;
          scriptureRef.textContent = scripture.reference;
          scriptureElement.classList.add('revealed');
        }, 600);
      } else {
        scriptureText.textContent = scripture.text;
        scriptureRef.textContent = scripture.reference;
        scriptureElement.classList.add('revealed');
      }
    });

    shareBtn.addEventListener('click', () => {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.textContent = '복사됨! ✓';
        shareBtn.classList.add('copied');

        setTimeout(() => {
          shareBtn.textContent = '친구와 나누기';
          shareBtn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        shareBtn.textContent = '복사 실패';
        setTimeout(() => {
          shareBtn.textContent = '친구와 나누기';
        }, 2000);
      });
    });
  </script>
</body>
</html>
